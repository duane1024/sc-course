title: "From Cray-1 to Frontier: A working engineer's history of supercomputer architecture"
# author is intentionally blank: the byline previously rendered as
# "By Duane Moore" in the page footer; attribution lives in the
# copyright line below and in the Acknowledgments section of intro.md.
author: ""
logo: ""
copyright: "2026 Duane Moore"
only_build_toc_files: true

# Published under https://fun-in-space.com/sc-course/
# This is used for sitemap.xml, OpenGraph meta tags, and canonical URLs.
# Internal navigation uses relative links and is unaffected.
html_baseurl: "https://fun-in-space.com/sc-course/"

execute:
  execute_notebooks: "off"

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  favicon: ""

repository:
  url: https://github.com/duane1024/sc-course
  branch: master

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution
    - tasklist

sphinx:
  config:
    html_theme_options:
      navigation_with_keys: true
